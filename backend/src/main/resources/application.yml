server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-interview-simulator

  # Database Configuration
  datasource:
    url: jdbc:h2:mem:ai_simulator;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Spring AI Configuration (Defaults to OpenAI API, inject via env)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key-for-now}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
